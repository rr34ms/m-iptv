<!doctype html>
<html lang="fr" data-root="../">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com https://vqxewdwjksglkuowdojb.supabase.co; form-action 'self'; base-uri 'none'; object-src 'none'" />
    <title>Mot de passe oublié — M-IPTV</title>
    <script type="module" crossorigin src="../assets/motDePasse-Co7kytiJ.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/common-CrKXlPpq.js">
    <link rel="stylesheet" crossorigin href="../assets/common-CYlf_Sle.css">
  </head>
  <body>
    <header id="site-header"></header>
    <main class="narrow">
      <h1 id="title">Mot de passe oublié</h1>

      <form id="request" class="card" novalidate>
        <p>Indiquez l’adresse de votre compte : vous recevrez un lien pour choisir un nouveau mot de passe. Le lien ne sert qu’une fois et expire au bout d’une heure.</p>
        <label>Adresse e-mail
          <input id="email" type="email" autocomplete="email" required maxlength="254" />
        </label>
        <div id="message" class="message" aria-live="polite"></div>
        <button class="btn btn-primary" type="submit" id="send">Recevoir le lien</button>
        <div class="links"><a href="../connexion/">Retour à la connexion</a></div>
      </form>

      <form id="reset" class="card" novalidate hidden>
        <p>Choisissez votre nouveau mot de passe.</p>
        <label>Nouveau mot de passe
          <span class="password"><input id="password" type="password" autocomplete="new-password" required maxlength="72" /></span>
          <span class="hint">10 caractères au moins, avec au moins une lettre et un chiffre.</span>
        </label>
        <label>Confirmez le mot de passe
          <span class="password"><input id="password2" type="password" autocomplete="new-password" required maxlength="72" /></span>
        </label>
        <div id="message2" class="message" aria-live="polite"></div>
        <button class="btn btn-primary" type="submit" id="save">Enregistrer</button>
      </form>
    </main>
  </body>
</html>
